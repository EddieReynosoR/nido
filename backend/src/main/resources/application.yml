spring:
  datasource:
    url: Djdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: nido

  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins:
      - http://localhost:5173

jwt:
  secret: ${JWT_SECRET}