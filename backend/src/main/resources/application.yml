spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:${DB_PORT}/${DB_NAME}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      schema: nido
  data:
    web:
      pageable:
        max-page-size: 50
  flyway:
    schemas:
      - nido
    default-schema: nido
    baseline-on-migrate: true
    baseline-version: 5

  jpa:
    hibernate:
      ddl-auto: validate

app:
  cors:
    allowed-origins:
      - http://localhost:5173
      - http://localhost:4173

jwt:
  secret: ${JWT_SECRET}