name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]
    # Optional: Only run on specific file changes
    # paths:
    #   - "src/**/*.ts"
    #   - "src/**/*.tsx"
    #   - "src/**/*.js"
    #   - "src/**/*.jsx"

jobs:
  claude-review:
    # Optional: Filter by PR author
    # if: |
    #   github.event.pull_request.user.login == 'external-contributor' ||
    #   github.event.pull_request.user.login == 'new-developer' ||
    #   github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR'

    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: read
      id-token: write
      checks: read
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Check for [skip-review] flag
        id: skip_check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          MSG=$(gh api \
            repos/${{ github.repository }}/commits/${{ github.event.pull_request.head.sha }} \
            --jq '.commit.message')
          if echo "$MSG" | grep -qi '\[skip-review\]'; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Run Claude Code Review
        id: claude-review
        if: steps.skip_check.outputs.skip != 'true' && !contains(github.event.pull_request.title, '[skip-review]')
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: 'https://github.com/anthropics/claude-code.git'
          plugins: 'code-review@claude-code-plugins'
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Be constructive and helpful in your feedback.

            IMPORTANT: For EACH issue you find (bugs, security problems, bad
            practices, performance concerns), post an inline comment on the
            specific line using the create_inline_comment tool. Be specific
            and constructive in each one.

            After reviewing all changes, you MUST also post one summary comment
            on the PR by running:
            gh pr comment ${{ github.event.pull_request.number }} --body "<your summary here>"

            The summary should list the issues found and give an overall assessment.

            Do not finish until you have posted your inline comments and the
            summary comment. Even if the code looks perfect, post a summary
            comment saying the review passed with no issues.
          claude_args: |
            --model claude-sonnet-5
            --allowedTools "mcp__github_inline_comment__create_inline_comment","Bash(gh pr view:*)","Bash(gh pr diff:*)","Bash(gh pr comment:*)"
          
          # Optional: Supply CLI flags for models, max turns, system prompts, tool access, etc.
          # claude_args: |
          #   --model claude-4-0-sonnet-20250805
          #   --allowedTools Bash(npm run test),Bash(npm run lint),Bash(npm run typecheck)

          # Optional: Use sticky comments to make Claude reuse the same comment on subsequent pushes to the same PR
          # use_sticky_comment: true
          
          # Optional: Customize review based on file types
          # prompt: |
          #   REPO: ${{ github.repository }}
          #   PR NUMBER: ${{ github.event.pull_request.number }}
          #
          #   Review this PR focusing on:
          #   - For TypeScript files: Type safety and proper interface usage
          #   - For API endpoints: Security, input validation, and error handling
          #   - For React components: Performance, accessibility, and best practices
          #   - For tests: Coverage, edge cases, and test quality
          
          # Optional: Different prompts for different authors
          # prompt: |
          #   REPO: ${{ github.repository }}
          #   PR NUMBER: ${{ github.event.pull_request.number }}
          #
          #   ${{ github.event.pull_request.author_association == 'FIRST_TIME_CONTRIBUTOR' && 
          #   'Welcome! Please review this PR from a first-time contributor. Be encouraging and provide detailed explanations for any suggestions.' ||
          #   'Please provide a thorough code review focusing on our coding standards and best practices.' }}
          
          # Optional: Skip review for certain conditions
          # if: |
          #   !contains(github.event.pull_request.title, '[skip-review]') &&
          #   !contains(github.event.pull_request.title, '[WIP]')

